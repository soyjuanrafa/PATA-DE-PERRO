    <script>
      // Suprimir advertencias benignas de reconexión WebSocket de Vite HMR en entorno de contenedor
      (function() {
        var isWsError = function(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : (err.message || err.reason || '')) + '';
          var lower = msg.toLowerCase();
          return lower.indexOf('websocket') !== -1 || lower.indexOf('ws://') !== -1 || lower.indexOf('wss://') !== -1 || msg.indexOf('[vite]') !== -1;
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason) || (event.reason && isWsError(event.reason.message))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isWsError(event.message) || isWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
